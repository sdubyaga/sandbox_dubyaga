name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Test suite tag to run'
        type: choice
        required: true
        default: "all"
        options:
          - all
          - "@smoke"
          - "@regression"
          - "@ui"
          - "@AI"
      workers:
        description: 'Number of parallel workers'
        required: true
        default: '1'
      base_url:
        description: 'Base URL for tests'
        required: true
        default: 'https://demoqa.com'
      retention_days:
        description: 'Days to retain the Playwright report'
        required: true
        default: '30'
  schedule:
      - cron: '0 6 * * *'
  push:
    branches: [ main, master ]  
  pull_request:
    branches: [ main, master ]  
  
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ inputs.base_url || 'https://demoqa.com' }}
      TEST_TAG: ${{ inputs.tag || 'all' }}
      WORKERS: ${{ inputs.workers || '1' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright Tests
      run: |
        if [ "$TEST_TAG" = "all" ]; then
          npx playwright test --workers="$WORKERS"
        else
          npx playwright test --grep="$TEST_TAG" --workers="$WORKERS"
        fi

    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: ${{ inputs.retention_days || 30 }}